version: 2

seeds:
  - name: states
    description: Справочник штатов США (50 штатов + DC) с регионом по классификации Бюро переписи.
    columns:
      - name: state_code
        description: Двухбуквенный код штата.
        data_tests: [not_null, unique]
      - name: state_name
        description: Полное название штата.
      - name: region
        description: Регион (Northeast, Midwest, South, West).
        data_tests:
          - accepted_values:
              arguments:
                values: [Northeast, Midwest, South, West]
